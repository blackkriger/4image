proxy_cache_path /var/cache/nginx/4image-api levels=1:2 keys_zone=fourimage_api:10m max_size=256m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/4image-img levels=1:2 keys_zone=fourimage_img:64m max_size=10g inactive=1d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=fourimage_rate:10m rate=10r/s;

map $uri $fourimage_archive_file {
  "~^/img/(v|vg|vm|vmg|vp|vrpg|vst|qb)/((\d{4})(\d{2})\d{7})\d*s\.jpg$" https://arch.b4k.dev/media/$1/thumb/$3/$4/$2s.jpg;
  "~^/img/(v|vg|vm|vmg|vp|vrpg|vst|qb)/(\d{13})\d*(\.\w+)$" https://arch-img.b4k.dev/$1/$2$3;
  "~^/img/(bant|c|e|i|n|news|out|p|pw|qst|toy|vip|vt|w|wg|wsr)/((\d{4})(\d{2})\d{7})\d*s\.jpg$" https://archive-media.palanq.win/$1/thumb/$3/$4/$2s.jpg;
  "~^/img/(bant|c|e|i|n|news|out|p|pw|qst|toy|vip|vt|w|wg|wsr)/((\d{4})(\d{2})\d{7})\d*(\.\w+)$" https://archive-media.palanq.win/$1/image/$3/$4/$2$5;
  default "";
}

map $request_uri $fourimage_robots {
  "~^/[a-z0-9]+(/archive)?/[0-9]+/?(\?|$)" "noindex";
  "~^/(aco|b|bant|d|e|f|gif|h|hc|hm|hr|i|ic|pol|r|r9k|s|s4s|soc|t|trash|u|wg|y)(/archive)?/?(\?|$)" "noindex";
  default "";
}

server {
  listen 80;
  listen [::]:80;
  server_name 4image.org www.4image.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://4image.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.4image.org;

  ssl_certificate /etc/letsencrypt/live/4image.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/4image.org/privkey.pem;

  return 301 https://4image.org$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name 4image.org;

  ssl_certificate /etc/letsencrypt/live/4image.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/4image.org/privkey.pem;

  root /var/www/4image;
  index index.html;
  include /etc/nginx/snippets/4image-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/4image-headers.conf;
    try_files $uri =404;
  }

  location = / {
    try_files /index.html =404;
  }

  location ~ ^/[a-z0-9]+(/archive)?(/[0-9]+)?/?$ {
    add_header X-Robots-Tag $fourimage_robots;
    include /etc/nginx/snippets/4image-headers.conf;
    proxy_pass http://127.0.0.1:3104;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @spa;
  }

  location @spa {
    add_header X-Robots-Tag $fourimage_robots;
    include /etc/nginx/snippets/4image-headers.conf;
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }

  location = /api/boards.json {
    limit_req zone=fourimage_rate burst=20 nodelay;
    proxy_pass https://a.4cdn.org/boards.json;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_api;
    proxy_cache_valid 200 1d;
  }

  location ~ ^/api/[a-z0-9]+/catalog\.json$ {
    limit_req zone=fourimage_rate burst=20 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass https://a.4cdn.org;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_api;
    proxy_cache_valid 200 30s;
  }

  location /api/ {
    limit_req zone=fourimage_rate burst=20 nodelay;
    proxy_pass https://a.4cdn.org/;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_api;
    proxy_cache_valid 200 10s;
  }

  location /img/ {
    proxy_pass https://i.4cdn.org/;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_img;
    proxy_cache_valid 200 1d;
    expires 1d;
    proxy_intercept_errors on;
    error_page 404 = @archive_file;
  }

  location @archive_file {
    if ($arg_archive = "0") {
      return 404;
    }
    if ($fourimage_archive_file = "") {
      return 404;
    }
    return 302 $fourimage_archive_file;
  }
}
