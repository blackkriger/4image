proxy_cache_path /var/cache/nginx/4image-api levels=1:2 keys_zone=fourimage_api:10m max_size=256m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/4image-img levels=1:2 keys_zone=fourimage_img:64m max_size=10g inactive=1d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=fourimage_api:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name 4image.org www.4image.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://4image.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.4image.org;

  ssl_certificate /etc/letsencrypt/live/4image.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/4image.org/privkey.pem;

  return 301 https://4image.org$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name 4image.org;

  ssl_certificate /etc/letsencrypt/live/4image.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/4image.org/privkey.pem;

  root /var/www/4image;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location = /api/boards.json {
    limit_req zone=fourimage_api burst=20 nodelay;
    proxy_pass https://a.4cdn.org/boards.json;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_api;
    proxy_cache_valid 200 1d;
  }

  location ~ ^/api/[a-z0-9]+/catalog\.json$ {
    limit_req zone=fourimage_api burst=20 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass https://a.4cdn.org;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_api;
    proxy_cache_valid 200 30s;
  }

  location /api/ {
    limit_req zone=fourimage_api burst=20 nodelay;
    proxy_pass https://a.4cdn.org/;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_api;
    proxy_cache_valid 200 10s;
  }

  location /img/ {
    proxy_pass https://i.4cdn.org/;
    include /etc/nginx/snippets/4image-proxy.conf;
    proxy_cache fourimage_img;
    proxy_cache_valid 200 1d;
    expires 1d;
  }
}
